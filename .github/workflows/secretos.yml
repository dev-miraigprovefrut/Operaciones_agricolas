name: Secretos (gitleaks)

# Revisa SOLO los commits nuevos de cada push: si alguien sube una clave, el commit queda
# en rojo y GitHub avisa por correo. NO bloquea ni toca el despliegue (va aparte).
# Los hallazgos viejos del historial no lo disparan.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secretos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Buscar claves en los commits nuevos
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGO="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ -z "${{ github.event.before }}" ] || [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            RANGO="${{ github.sha }}~1..${{ github.sha }}"
          else
            RANGO="${{ github.event.before }}..${{ github.sha }}"
          fi
          echo "Revisando $RANGO"
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.18.4 detect --source /repo \
            --log-opts="$RANGO" --redact --verbose --no-banner
