version: 1
# Frontend en Amplify. Las variables de produccion estan en frontend/.env.production
# (solo URLs publicas; la sesion va en la cookie HttpOnly del HUB, sin tokens).
frontend:
  phases:
    preBuild:
      commands:
        - cd frontend
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: frontend/dist
    files:
      - '**/*'
  cache:
    paths:
      - frontend/.npm/**/*
